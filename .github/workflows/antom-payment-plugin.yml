name: Antom payment plugin

on:
  pull_request:
    paths:
      - 'plugins/antom-payment/**'
      - '.github/workflows/antom-payment-plugin.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/antom-payment/**'
      - '.github/workflows/antom-payment-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/antom-payment

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/antom-payment/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm audit
